[project]
name = "port"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "abc-xml-converter>=1.0.1",
    "boto3>=1.42.5",
    "music21>=9.9.1",
    "pandas>=2.3.3",
    "pypdf>=6.7.0",
    "python-dotenv>=1.2.1",
    "soundsliceapi>=1.1",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "boto3-stubs~=1.42.5",
    "ipykernel>=7.1.0",
    "moto>=5.1.18",
    "pandas-stubs~=2.3.3",
    "pytest>=9.0.2",
    "pyinstaller>=6.0.0"
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
port = ["assets/*"]
